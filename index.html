<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Momentum - Alternative Education Student Growth Platform">
    <title>Momentum</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">

        <aside id="sidebar">
            <div id="sidebar-header">
                <h1>Momentum</h1>
            </div>

            <nav id="navigation" aria-label="Main Navigation">
                <ul>
                    <li><button id="nav-dashboard" class="nav-button" type="button">Dashboard</button></li>
                    <li><button id="nav-students" class="nav-button" type="button">Students</button></li>
                    <li><button id="nav-learning-journey" class="nav-button" type="button">Learning Journey</button></li>
                    <li><button id="nav-follow-ups" class="nav-button" type="button">Follow-Ups</button></li>
                    <li><button id="nav-reports" class="nav-button" type="button">Reports</button></li>
                    <li><button id="nav-settings" class="nav-button" type="button">Settings</button></li>
                </ul>
            </nav>
        </aside>

        <main id="main-content">

            <header id="header">
                <h2>Momentum</h2>
            </header>

            <section id="page-container">

                <section id="dashboard-page" class="page">
                    <div id="dashboard-content"></div>
                </section>

                <section id="students-page" class="page" hidden>
                    <div id="students-content"></div>
                </section>

                <section id="learning-journey-page" class="page" hidden>
                    <div id="learning-journey-content"></div>
                </section>

                <section id="follow-ups-page" class="page" hidden>
                    <div id="follow-ups-content"></div>
                </section>

                <section id="reports-page" class="page" hidden>
                    <div id="reports-content"></div>
                </section>

                <section id="settings-page" class="page" hidden>
                    <div id="settings-content"></div>
                </section>

            </section>

        </main>

    </div>

    <script src="app.js"></script>
</body>
</html>
